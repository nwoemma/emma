{% extends "base.html" %}
{% block content %}

<body>
    <h1>Products</h1>
    <ul>
        {% for products in product %}
            <li>
                <a href="{% url 'shop:product_detail' products.pk %}">{{ products.name }}</a> - ${{ products.price }}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
 
{% endblock content %}
